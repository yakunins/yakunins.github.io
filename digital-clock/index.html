<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />
        <link rel="icon" href="./icon-16.png" />
        <link rel="preload" href="js/vendor.js" as="script" />
        <link rel="preload" href="js/newtab.js" as="script" />

        <title>Digital Clock in New Tab (Browser Extension)</title>

        <script src="js/vendor.js" defer></script>
        <script src="js/newtab.js" defer></script>
        <style>
            .title {
                --color: white;

                color: var(--color, white);
                flex-direction: row;
                place-items: center;
                text-align: center;
                z-index: 10;

                position: fixed;
                top: 0;
                left: 0;
                width: 100%;

                h1 {
                    font-size: 2.5em;
                    font-weight: 400;
                    margin-bottom: 0;
                    margin-top: 0.65em;
                }
            }
            p,
            .links {
                font-size: 120%;
                font-weight: 500;
            }
            .links {
                --border-color: color-mix(
                    in srgb,
                    var(--color),
                    transparent 65%
                );

                display: flex;
                gap: 0;

                a {
                    backdrop-filter: blur(0.5em);
                    color: var(--color);
                    display: flex;
                    gap: 0.3em;
                    place-items: center;
                    border-top: 1px solid var(--border-color);
                    border-bottom: 1px solid var(--border-color);
                    text-decoration: none;
                    padding: calc(var(--padding) * 1.25)
                        calc(var(--padding) * 2);
                    transition: background 0.2s;

                    &:first-child {
                        border-left: 1px solid var(--border-color);
                        border-top-left-radius: var(--radius);
                        border-bottom-left-radius: var(--radius);
                    }
                    &:last-child {
                        border-right: 1px solid var(--border-color);
                        border-top-right-radius: var(--radius);
                        border-bottom-right-radius: var(--radius);
                    }
                    &:hover {
                        background: rgba(255, 255, 255, 0.1);
                    }

                    img {
                        width: 1.35em;
                        margin-bottom: -1px;
                    }
                    i {
                        font-style: normal;
                        vertical-align: 8px;
                        margin-block: -10px;
                        display: inline-block;
                        margin-inline-end: -6px;
                    }
                }
                .line {
                    border-left: 1px solid var(--border-color);
                    transform: rotate(8deg);
                    margin-left: -1px;
                    z-index: 2;
                }
            }
            @media (pointer: coarse) {
                .title h1 {
                    font-size: 1.5em;
                }
            }
        </style>
    </head>

    <body class="extension-newtab">
        <div id="root"></div>

        <script>
            window.addEventListener("load", () => {
                const day = 1000 * 60 * 60 * 24;
                if (sinceLastVisit() > day) openSettings();
            });

            const openSettings = () => {
                const opened = document.querySelector(
                    "#root .settings-dropdown:has(.settings-overlay)"
                );
                if (opened) return;

                const trigger = document.querySelector(
                    "#root .settings-dropdown > div > button"
                );
                setTimeout(() => trigger?.click(), 50);
            };

            const sinceLastVisit = () => {
                const storage_key = "visit_timestamp";
                const stored = localStorage.getItem(storage_key);
                const last_visit = new Date(
                    stored ? parseInt(stored, 10) : 0
                ).getTime();
                const now = new Date().getTime();
                const since_last_visit = now - last_visit;
                localStorage.setItem(storage_key, now);
                return since_last_visit;
            };
        </script>

        <div class="title">
            <h1>Digital Clock in a New Tab<br /></h1>
            <p style="margin-top: 0.1em; margin-bottom: 0.75em">
                Get extension:
            </p>
            <div class="links">
                <a
                    target="_blank"
                    href="https://chromewebstore.google.com/detail/digital-clock-in-a-new-ta/jigadjkijhkamfmjfjnjlgojkdednakp"
                    rel="noopener noreferrer"
                >
                    <img src="./chrome-web-store.svg" alt="chrome web store" />
                    <span>Chrome<i>↗</i></span></a
                >
                <span class="line"></span>
                <a
                    target="_blank"
                    href="https://addons.mozilla.org/en-US/firefox/addon/digital-clock-in-a-new-tab/"
                    rel="noopener noreferrer"
                >
                    <img src="./firefox-logo.svg" alt="firefox addons" />
                    <span>Firefox<i>↗</i></span></a
                >
            </div>
        </div>
    </body>
</html>

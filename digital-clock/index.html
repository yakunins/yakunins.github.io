<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>New Tab</title>
        <script src="js/vendor.js"></script>
        <style>
            .title {
                color: var(--color, white);
                flex-direction: row;
                place-items: center;
                text-align: center;
                z-index: 10;

                position: fixed;
                top: 0;
                left: 0;
                width: 100%;

                h1 {
                    font-family: "Work Sans", WorkSansEmbedded, "Segoe UI",
                        Segoe, sans-serif;
                    font-size: 2.5em;
                    font-weight: 200;
                }
            }
            .links {
                display: flex;
                gap: 1px;

                a {
                    backdrop-filter: blur(0.5em);
                    color: black;
                    display: flex;
                    gap: 0.3em;
                    place-items: center;
                    background: rgba(255, 255, 255, 0.2);
                    text-decoration: none;
                    padding: calc(var(--padding) * 1.25)
                        calc(var(--padding) * 2);
                    transition: background 0.2s;

                    &:first-child {
                        border-top-left-radius: var(--radius);
                        border-bottom-left-radius: var(--radius);
                    }
                    &:last-child {
                        border-top-right-radius: var(--radius);
                        border-bottom-right-radius: var(--radius);
                    }
                    &:hover {
                        background: rgba(255, 255, 255, 0.3);
                    }

                    img {
                        width: 1.35em;
                        margin-bottom: -1px;
                    }
                    i {
                        font-style: normal;
                        vertical-align: 8px;
                        margin-block: -10px;
                        display: inline-block;
                        margin-inline-end: -6px;
                    }
                }
            }
        </style>
    </head>

    <body class="extension-newtab">
        <div id="root"></div>
        <script src="js/newtab.js"></script>

        <div class="title">
            <h1>Digital Clock in a New Tab</h1>
            <div class="links">
                <a
                    target="_blank"
                    href="https://chromewebstore.google.com/detail/digital-clock-in-a-new-ta/jigadjkijhkamfmjfjnjlgojkdednakp"
                >
                    <img src="./chrome-web-store.svg" />
                    <span>Chrome<i>↗</i></span></a
                >
                <a
                    target="_blank"
                    href="https://addons.mozilla.org/en-US/firefox/addon/digital-clock-in-a-new-tab/"
                >
                    <img src="./firefox-logo.svg" />
                    <span>Firefox<i>↗</i></span></a
                >
            </div>
        </div>
    </body>
</html>
